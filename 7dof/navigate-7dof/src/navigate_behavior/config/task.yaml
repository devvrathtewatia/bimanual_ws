# =============================================================================
# SECTION D configuration - NAVIGATE: scan a room, drive to every lying object, stand it up.
#
# The same robot and the same stand-up as the reorient and perceive sections - the task
# parameters below are theirs, key for key - with the room added. NOTHING here says where an
# object is, which way it lies, or which way to look: the scan finds them. The world file puts
# them where it likes, metres apart.
#
# HEIGHTS FROM THE SURFACE, as in every section: surface_z is what an object lies on (the
# floor here); cz and upright_cz are its centre heights above it, lying and standing.
# =============================================================================

perception_node:
  ros__parameters:
    # THE WORKSPACE CAMERA, in base_link: precise over the reach, blind beyond 0.45 m.
    # Must be the camera in mast_sensors.xacro - test_the_cameras_are_the_urdf reads both.
    cam_x: 0.05
    cam_y: 0.0
    cam_z: 0.62
    cam_pitch: 1.244
    horizontal_fov: 1.204
    image_width: 640
    image_height: 480
    min_area: 250            # px; an object at 0.30 m covers 10 000 - 15 000
    # THE MAST CAMERA, forward and 15 deg down: sees across the room. With the arms in the
    # look pose the bottom of its image is arm below row 330 (test_the_look_pose_clears_the_
    # mast_camera_above_far_v_max), so a blob reaching past it is refused as clipped.
    far_camera: true
    far_cam_x: -0.075
    far_cam_y: 0.0
    far_cam_z: 0.42
    far_cam_pitch: 0.2618
    far_horizontal_fov: 1.204
    far_image_width: 640
    far_image_height: 480
    far_min_area: 120        # px; an object at 2.4 m covers about 600
    far_v_max: 330
    objects: [bottle, can, box]
    # HSV windows (OpenCV: hue 0-180). Each is centred on the model's own colour and checked
    # by test_the_colour_windows_contain_the_models, lit and in shade, and against the robot's
    # own colours so an arm cannot be mistaken for an object.
    bottle: {hsv_lo: [5, 150, 40], hsv_hi: [22, 255, 255], length: 0.240, half_width: 0.045, round: true, surface_z: 0.0}
    can: {hsv_lo: [100, 110, 35], hsv_hi: [135, 255, 255], length: 0.200, half_width: 0.045, round: true, surface_z: 0.0}
    box: {hsv_lo: [40, 90, 35], hsv_hi: [80, 255, 255], length: 0.220, half_width: 0.045, round: false, surface_z: 0.0}

task_node:
  ros__parameters:
    reach: 0.30              # the stand-up's verified station - as in the reorient section
    flip_z: 0.24             # object centre height during the rotation
    hover_dz: 0.10
    open_pos: 0.065
    tilt_warn_deg: 1.5
    tilt_abort_deg: 4.0
    force_warn_n: 15.0
    force_abort_n: 30.0
    wall_max_rms: 0.03
    heading_tol: 0.004
    place_drop: 0.010        # suction released this far above the surface
    grasp_mode: suction      # the same grasp as the other sections
    weld_rescue: false
    slip_warn_mm: 5.0
    slip_abort_mm: 15.0
    regrasp_attempts: 2
    regrasp_deeper: 0.004
    rotate_speed: 0.45
    settle_tol: 0.08
    position_deadband: 0.025
    drive_speed: 0.08
    dt_grasp: 2.0            # s per waypoint, empty-handed moves
    dt_flip: 2.5             # s per waypoint, loaded rotation
    dt_travel: 1.5           # s per waypoint, the planned paths to and from parked
    dt_look: 1.0             # s per point, the arms to and from the look pose
    # ALL TIMES ARE SIMULATED SECONDS.
    tilt_tol_deg: 8.0
    move_tol: 0.030
    settle_recheck_s: 2.0

    # ---- perception ----
    sense_frames: 5          # a MEDIAN of this many fresh frames, all taken after the
                             # arms were out of view and the base had stopped
    sense_timeout: 8.0       # simulated s to wait for them
    max_axis_dev_deg: 20.0   # the stand-up's grasp envelope around tangential
    square_on_deg: 1.0       # turn to face an object further off-centre than this
    reach_window: 0.03       # the stand-up is not attempted outside reach +/- this

    # ---- navigation ----
    # THE ROOM: the FACES of its four walls, x_min x_max y_min y_max - what the LiDAR sees and
    # room_ref localises from. test_the_room_is_the_world reads navigate.sdf to check.
    room: [-2.5, 2.5, -2.5, 2.5]
    room_band: [0.15, 7.5]   # LiDAR range window: past the robot's own mast, inside the room
    room_max_rms: 0.02
    scan_point: [0.0, 0.0]   # where every scan is made from - and the starting pose
    scan_headings: 8         # 45 deg apart: the mast camera's 69 deg view overlaps by 24
    backup: 0.35             # m straight back after a stand-up, before turning
    nav_speed: 0.15          # m/s in transit
    approach_speed: 0.05     # m/s near an object
    nav_accel: 0.25          # m/s^2
    max_rounds: 3            # scans; the last must see every object standing
    park_tol: 0.010          # m of reach error the park accepts
    park_axis_tol_deg: 5.0   # deg of axis error the park accepts
    park_attempts: 3

    order: [bottle, can, box]

    # THE STATIC WORLD, for the arm planner: the room's walls as boxes, exactly as in
    # navigate.sdf (test_the_fixtures_are_the_world).
    fixtures: [wall_n, wall_s, wall_e, wall_w]
    wall_n:
      centre: [0.0, 2.55, 0.45]
      size: [5.2, 0.10, 0.90]
      yaw: 0.0
    wall_s:
      centre: [0.0, -2.55, 0.45]
      size: [5.2, 0.10, 0.90]
      yaw: 0.0
    wall_e:
      centre: [2.55, 0.0, 0.45]
      size: [0.10, 5.2, 0.90]
      yaw: 0.0
    wall_w:
      centre: [-2.55, 0.0, 0.45]
      size: [0.10, 5.2, 0.90]
      yaw: 0.0

    # NO POSITIONS, NO AXIS ANGLES, NO BEARINGS: what each object is, not where.
    bottle:
      length: 0.240
      half_width: 0.045
      round: true
      mass: 0.45
      surface_z: 0.0
      cz: 0.045
      upright_cz: 0.12
      close: 0.048
    can:
      length: 0.200
      half_width: 0.045
      round: true
      mass: 0.35
      surface_z: 0.0
      cz: 0.045
      upright_cz: 0.10
      close: 0.048
    box:
      length: 0.220
      half_width: 0.045
      round: false           # FLAT: the fingertips must not curl into its faces
      mass: 0.50
      surface_z: 0.0
      cz: 0.045
      upright_cz: 0.11
      close: 0.048

verify_node:
  ros__parameters:
    title: SECTION D VERIFICATION
    tilt_tol_deg: 8.0
    move_tol: 0.030
    objects: [bottle, can, box]
    # expected standing height is surface_z + upright_cz; "where it started" is where Gazebo
    # first reports it, since nothing here says where anything is
    bottle: {upright_cz: 0.12, surface_z: 0.0}
    can: {upright_cz: 0.10, surface_z: 0.0}
    box: {upright_cz: 0.11, surface_z: 0.0}
